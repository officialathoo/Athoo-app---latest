name: EAS Preview APK Build

on:
  push:
    branches:
      - release/athoo-v2.2-production-certification
    paths:
      - ".github/workflows/eas-preview-apk.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: eas-preview-apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-preview-apk:
    name: Build preview APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN || secrets.EAS_TOKEN }}
      EAS_PROJECT_ID: ${{ secrets.EAS_PROJECT_ID || vars.EAS_PROJECT_ID }}
      APP_ENV: staging
      APP_VERSION: "2.2.0"
      EXPO_PUBLIC_RELEASE_VERSION: "2.2.0"
      EXPO_PUBLIC_RELEASE_COMMIT_SHA: ${{ github.sha }}
      EXPO_PUBLIC_API_BASE_URL: https://athoo-api.onrender.com
      API_BASE_URL: https://athoo-api.onrender.com
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.33.2

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify build environment
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "EXPO_TOKEN or EAS_TOKEN GitHub secret is required for cloud EAS build."
            exit 1
          fi
          if [ -z "$EAS_PROJECT_ID" ]; then
            echo "EAS_PROJECT_ID GitHub secret or variable is required so the APK targets the same Expo project."
            exit 1
          fi
          node -e "const cfg = require('./athoo-app/app.config.js').expo; if (cfg.extra.API_BASE_URL !== 'https://athoo-api.onrender.com') throw new Error('API URL not embedded for preview APK'); if (!cfg.extra.eas || !cfg.extra.eas.projectId) throw new Error('EAS project id not embedded for preview APK'); console.log('APK config OK:', cfg.extra.API_BASE_URL, cfg.extra.RELEASE_IDENTITY.commitSha);"

      - name: Build EAS preview Android APK
        working-directory: athoo-app
        run: |
          set -o pipefail
          npx eas-cli@latest build --platform android --profile preview --non-interactive --wait --json | tee ../eas-preview-apk-result.json

      - name: Summarize APK build
        if: always()
        run: |
          echo "# Athoo Preview APK Build" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Commit: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "Profile: preview" >> "$GITHUB_STEP_SUMMARY"
          echo "Platform: android" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          if [ -f eas-preview-apk-result.json ]; then
            node - <<'NODE' >> "$GITHUB_STEP_SUMMARY"
          const fs = require('fs');
          const raw = fs.readFileSync('eas-preview-apk-result.json', 'utf8');
          const urls = [...new Set(raw.match(/https?:\/\/[^\s"']+/g) || [])];
          const apkUrls = urls.filter((url) => url.toLowerCase().includes('.apk'));
          const buildUrls = urls.filter((url) => url.includes('expo.dev') || url.includes('eas'));
          if (apkUrls.length) {
            console.log('APK download URL:');
            apkUrls.forEach((url) => console.log(`- ${url}`));
          }
          if (buildUrls.length) {
            console.log('Build details URL:');
            buildUrls.forEach((url) => console.log(`- ${url}`));
          }
          NODE
          else
            echo "No EAS result file was generated." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload EAS result metadata
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: eas-preview-apk-result
          path: eas-preview-apk-result.json
          if-no-files-found: ignore
